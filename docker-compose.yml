version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pharma_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pharma_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pharma_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/pharma_analytics
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pharma_frontend
    restart: always
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/pharma_analytics
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
